<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="26" font-family="Arial, sans-serif" font-weight="bold">Registros recuperados por base bibliográfica</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#4a4a4a">WOS, Scopus y PubMed (estrategia documentada)</text>

  <g transform="translate(120,120)">
    <line x1="0" y1="260" x2="620" y2="260" stroke="#333"/>
    <line x1="0" y1="0" x2="0" y2="260" stroke="#333"/>

    <g>
      <rect x="40" y="70" width="120" height="190" fill="#1f77b4"/>
      <text x="100" y="285" text-anchor="middle" font-size="18" font-family="Arial, sans-serif">WOS</text>
      <text x="100" y="58" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="bold">1,828</text>
    </g>

    <g>
      <rect x="240" y="155" width="120" height="105" fill="#ff7f0e"/>
      <text x="300" y="285" text-anchor="middle" font-size="18" font-family="Arial, sans-serif">Scopus</text>
      <text x="300" y="145" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="bold">1,045</text>
    </g>

    <g>
      <rect x="440" y="204" width="120" height="56" fill="#2ca02c"/>
      <text x="500" y="285" text-anchor="middle" font-size="18" font-family="Arial, sans-serif">PubMed</text>
      <text x="500" y="196" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="bold">654</text>
    </g>

    <text x="-15" y="15" font-size="12" font-family="Arial, sans-serif" transform="rotate(-90 -15 15)">Registros</text>
  </g>
</svg>
